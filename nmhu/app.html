<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cowboys Bot — XSEN Highlands</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>

<style>
:root {
  --purple:#4B2E83;
  --purple-deep:#321d5c;
  --gold:#C9A84C;
  --ink:#080808;
  --surface:#111;
  --surface-2:#1a1a1a;
  --border:rgba(75,46,131,0.28);
  --text:#f0ece0;
  --text-muted:rgba(240,236,224,0.45);
}

body {
  margin:0;
  background:var(--ink);
  color:var(--text);
  font-family:'DM Sans', sans-serif;
}

/* HEADER */
.chat-header {
  display:flex;
  justify-content:space-between;
  padding:12px;
  background:linear-gradient(135deg,#321d5c,#4B2E83);
  color:white;
}

/* VIDEO */
.video-player-wrap {
  position:relative;
  aspect-ratio:16/9;
  background:black;
}

#liveVideoFrame {
  position:absolute;
  width:100%;
  height:100%;
  border:none;
}

/* CHAT CONTAINER */
#liveChatContainer {
  display:flex;
  flex-direction:column;
  height:220px;
  border-top:1px solid var(--border);
  background:var(--surface);
}

#liveChatMessages {
  flex:1;
  overflow-y:auto;
  padding:10px;
  font-size:13px;
}

.live-chat-msg {
  margin-bottom:6px;
}

#liveChatForm {
  display:flex;
  border-top:1px solid var(--border);
}

#liveChatInput {
  flex:1;
  padding:10px;
  border:none;
  background:var(--surface-2);
  color:white;
}

#liveChatForm button {
  width:70px;
  background:var(--purple);
  border:none;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<header class="chat-header">
  <div>Cowboys Bot</div>
</header>

<!-- VIDEO -->
<div class="video-player-wrap">
  <iframe id="liveVideoFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<!-- ✅ REPLACED YOUTUBE CHAT WITH YOUR OWN CHAT -->
<div id="liveChatContainer">
  <div id="liveChatMessages"></div>

  <form id="liveChatForm">
    <input id="liveChatInput" placeholder="Join the conversation..." />
    <button type="submit">Send</button>
  </form>
</div>

<script>
const CHAT_SERVER_URL = 'https://nmhu-chat-production.up.railway.app';
const CHANNEL_ID = 'nmhu-live';

/* VIDEO */
const STREAM_ID = ''; // put YouTube ID here if needed
const liveVideoFrame = document.getElementById('liveVideoFrame');

if (STREAM_ID) {
  liveVideoFrame.src = `https://www.youtube.com/embed/${STREAM_ID}?autoplay=1&mute=1`;
}

/* CHAT ELEMENTS */
const chatMessages = document.getElementById('liveChatMessages');
const chatForm = document.getElementById('liveChatForm');
const chatInput = document.getElementById('liveChatInput');

/* SEND MESSAGE */
chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = chatInput.value.trim();
  if (!text) return;

  await fetch(`${CHAT_SERVER_URL}/chat/send`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      channel: CHANNEL_ID,
      message: text
    })
  });

  chatInput.value = '';
});

/* LOAD MESSAGES */
async function loadChat() {
  try {
    const res = await fetch(`${CHAT_SERVER_URL}/chat/messages?channel=${CHANNEL_ID}`);
    const data = await res.json();

    chatMessages.innerHTML = (data.messages || [])
      .map(m => `<div class="live-chat-msg"><strong>${m.user || 'Fan'}:</strong> ${m.text}</div>`)
      .join('');

    chatMessages.scrollTop = chatMessages.scrollHeight;
  } catch(e) {}
}

setInterval(loadChat, 3000);
loadChat();
</script>

</body>
</html>
