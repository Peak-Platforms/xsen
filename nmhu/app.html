<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cowboys Bot — XSEN Highlands</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root {
  --purple:#4B2E83;
  --surface:#111;
  --surface-2:#1a1a1a;
  --border:rgba(75,46,131,0.28);
  --text:#f0ece0;
}

body {
  margin:0;
  background:#000;
  color:var(--text);
  font-family:sans-serif;
}

/* VIDEO */
.video-wrap {
  position:relative;
  padding-top:56.25%;
  background:#000;
}

.video-wrap iframe {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  border:none;
}

/* CHAT */
#liveChatContainer {
  display:flex;
  flex-direction:column;
  height:200px;
  border-top:1px solid var(--border);
  background:#000;
}

#liveChatMessages {
  flex:1;
  overflow-y:auto;
  padding:10px;
  font-size:13px;
}

.live-chat-msg {
  margin-bottom:6px;
}

#liveChatForm {
  display:flex;
  border-top:1px solid var(--border);
}

#liveChatInput {
  flex:1;
  padding:10px;
  border:none;
  background:var(--surface-2);
  color:white;
}

#liveChatForm button {
  width:70px;
  border:none;
  background:var(--purple);
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- VIDEO -->
<div class="video-wrap">
  <iframe id="liveVideoFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<!-- YOUR CHAT -->
<div id="liveChatContainer">
  <div id="liveChatMessages"></div>
  <form id="liveChatForm">
    <input type="text" id="liveChatInput" placeholder="Join the conversation…" />
    <button type="submit">Send</button>
  </form>
</div>

<script>
const CHAT_SERVER_URL = 'https://nmhu-chat-production.up.railway.app';
const CHANNEL_ID = 'nmhu-live';

const videoFrame = document.getElementById('liveVideoFrame');
const chatMessages = document.getElementById('liveChatMessages');
const chatForm = document.getElementById('liveChatForm');
const chatInput = document.getElementById('liveChatInput');

/* SET YOUR YOUTUBE STREAM ID HERE */
const STREAM_ID = ''; // e.g. 'abc123xyz'

if (STREAM_ID) {
  videoFrame.src = `https://www.youtube.com/embed/${STREAM_ID}?autoplay=1`;
}

/* SEND MESSAGE */
chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const text = chatInput.value.trim();
  if (!text) return;

  await fetch(`${CHAT_SERVER_URL}/chat/send`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      channel: CHANNEL_ID,
      message: text
    })
  });

  chatInput.value = '';
});

/* LOAD MESSAGES */
async function loadMessages() {
  try {
    const res = await fetch(`${CHAT_SERVER_URL}/chat/messages?channel=${CHANNEL_ID}`);
    const data = await res.json();

    chatMessages.innerHTML = (data.messages || [])
      .map(m => `<div class="live-chat-msg"><strong>${m.user || 'Fan'}:</strong> ${m.text}</div>`)
      .join('');

    chatMessages.scrollTop = chatMessages.scrollHeight;
  } catch(e){}
}

/* POLLING */
setInterval(loadMessages, 3000);
loadMessages();

</script>

</body>
</html>
