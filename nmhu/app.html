<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cowboys Bot — XSEN Highlands</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>

<style>
:root {
  --purple:#4B2E83;
  --purple-deep:#321d5c;
  --gold:#C9A84C;
  --ink:#080808;
  --surface:#111;
  --surface-2:#1a1a1a;
  --border:rgba(75,46,131,0.28);
  --text:#f0ece0;
  --text-muted:rgba(240,236,224,0.45);
}

/* ===== YOUR ORIGINAL STYLES PRESERVED (TRUNCATED HERE) ===== */
/* (NO CHANGES ABOVE) */

/* =========================
   🔥 ADD ONLY CHAT STYLES
========================= */
#liveChatContainer {
  width: 100%;
  height: 200px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
}

#liveChatMessages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  font-size: 13px;
}

.live-chat-msg {
  margin-bottom: 6px;
  color: var(--text);
}

#liveChatForm {
  display: flex;
  border-top: 1px solid var(--border);
}

#liveChatInput {
  flex: 1;
  padding: 10px;
  border: none;
  background: var(--surface-2);
  color: var(--text);
}

#liveChatForm button {
  width: 70px;
  border: none;
  background: var(--purple);
  color: white;
}
</style>
</head>

<body>

<!-- =========================
     YOUR ORIGINAL UI (UNCHANGED ABOVE)
========================= -->

<!-- LIVE VIDEO PANEL -->
<div id="liveVideoPanel">

  <div class="live-video-wrap">
    <iframe id="liveVideoFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>

  <!-- 🔥 REPLACED YOUTUBE CHAT FRAME -->
  <div id="liveChatContainer">
    <div id="liveChatMessages"></div>

    <form id="liveChatForm">
      <input id="liveChatInput" placeholder="Join the conversation…" />
      <button type="submit">Send</button>
    </form>
  </div>

</div>

<script>
const CHAT_SERVER_URL = 'https://nmhu-chat-production.up.railway.app';
const CHANNEL_ID = 'nmhu-live';

/* =========================
   VIDEO (UNCHANGED LOGIC)
========================= */
const liveVideoFrame = document.getElementById('liveVideoFrame');

/* =========================
   🔥 CHAT (NEW)
========================= */
const chatMessages = document.getElementById('liveChatMessages');
const chatForm = document.getElementById('liveChatForm');
const chatInput = document.getElementById('liveChatInput');

/* SEND MESSAGE */
chatForm?.addEventListener('submit', async (e) => {
  e.preventDefault();

  const text = chatInput.value.trim();
  if (!text) return;

  await fetch(`${CHAT_SERVER_URL}/chat/send`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      channel: CHANNEL_ID,
      message: text
    })
  });

  chatInput.value = '';
});

/* LOAD MESSAGES */
async function loadChat() {
  try {
    const res = await fetch(`${CHAT_SERVER_URL}/chat/messages?channel=${CHANNEL_ID}`);
    const data = await res.json();

    if (!chatMessages) return;

    chatMessages.innerHTML = (data.messages || [])
      .map(m => `<div class="live-chat-msg"><strong>${m.user || 'Fan'}:</strong> ${m.text}</div>`)
      .join('');

    chatMessages.scrollTop = chatMessages.scrollHeight;
  } catch (e) {}
}

setInterval(loadChat, 3000);
loadChat();

/* =========================
   YOUTUBE LIVE LOGIC (FIXED)
========================= */
async function checkYTLive() {
  try {
    const { data } = await window.supabase
      .from('xsen_stations')
      .select('youtube_live_id')
      .eq('school', 'NMHU')
      .single();

    const streamId = data?.youtube_live_id || '';

    if (streamId) {
      if (liveVideoFrame.getAttribute('data-stream') !== streamId) {
        liveVideoFrame.setAttribute('data-stream', streamId);
        liveVideoFrame.src =
          `https://www.youtube.com/embed/${streamId}?autoplay=1&mute=0`;
      }
    } else {
      liveVideoFrame.removeAttribute('data-stream');
      liveVideoFrame.src = '';
    }

  } catch(e) {}
}

checkYTLive();
setInterval(checkYTLive, 30000);

</script>

</body>
</html>
